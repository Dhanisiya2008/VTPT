<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitBuddy - User Input</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: url('/static/images/gym-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: rgba(0,0,0,0.7);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: 700;
        }
        input, select {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.5rem;
            border-radius: 5px;
            border: none;
        }
        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.75rem;
            background: #ff5722;
            border: none;
            border-radius: 5px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background: #e64a19;
        }
        @media (max-width: 600px) {
            .form-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>FitBuddy</h1>
        <form action="/generate-workout" method="post">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>User ID</label>
            <input type="number" name="user_id" required>
            <label>Age</label>
            <input type="number" name="age" required>
            <label>Weight</label>
            <input type="number" name="weight" required>
            <label>Goal</label>
            <input type="text" name="goal" required>
            <label>Intensity</label>
            <select name="intensity">
                <option>low</option>
                <option>medium</option>
                <option>high</option>
            </select>
            <button type="submit">Generate Workout</button>
        </form>
    </div>
</body>
</html>
