<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - Admin Dashboard</title>
    <meta charset="UTF-8">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #121212;
            color: #fff;
            padding: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
        }
        th, td {
            border: 1px solid #333;
            padding: 1rem;
            text-align: left;
        }
        th {
            background: #1e1e1e;
            font-weight: 700;
        }
        td pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>All Users</h1>
    <table border="1">
        <tr>
            <th>Name</th><th>Age</th><th>Weight</th><th>Goal</th><th>Intensity</th>
            <th>Original Plan</th><th>Updated Plan</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.age }}</td>
            <td>{{ user.weight }}</td>
            <td>{{ user.goal }}</td>
            <td>{{ user.intensity }}</td>
            <td><pre>{{ user.original_plan }}</pre></td>
            <td><pre>{{ user.updated_plan }}</pre></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
